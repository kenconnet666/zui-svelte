# 项目受信任后加载。cwd 相对于本 .codex 目录，参数相对于子进程工作目录。
[mcp_servers.zui_lsp]
command = "node"
args = ["scripts/language-services/server.mjs"]
cwd = ".."
startup_timeout_sec = 30
tool_timeout_sec = 90

[mcp_servers.svelte]
command = "node"
args = ["node_modules/@sveltejs/mcp/dist/index.mjs"]
cwd = ".."
startup_timeout_sec = 30
tool_timeout_sec = 90
