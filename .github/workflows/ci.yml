name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # master 按提交保留验收，避免持续推进时取消上一候选；PR 仍只保留最新运行。
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build, browser tests and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare SvelteKit fixture links and generated types
        run: pnpm --filter @zui/svelte run test:kit:prepare

      - name: Lint and formatting
        run: pnpm run lint

      - name: Build library distributions for consumers
        # Docs 的类型也消费 dist；先生成库产物，禁止回退源码条件。
        run: pnpm run build:libs

      - name: Type and Svelte checks
        run: pnpm run check

      - name: Verify generated CSS metadata
        run: pnpm run generate:check

      - name: Test core contracts
        run: pnpm run test:core

      - name: Test class compiler contracts
        run: pnpm --filter @zui/svelte run test

      - name: Build docs as a distribution consumer
        run: pnpm --filter @zui/docs build

      - name: Verify public API and browser distribution budgets
        run: pnpm run contracts:check

      - name: Verify UI component distribution boundaries and budgets
        run: pnpm run contracts:ui

      - name: Measure core runtime and verify allocation budgets
        run: node --expose-gc scripts/benchmark-core.mjs

      - name: Verify built package entrypoints
        working-directory: docs
        run: |
          node --input-type=module -e "
            for (const name of ['@zui/core', '@zui/svelte']) {
              const resolved = import.meta.resolve(name);
              if (!resolved.endsWith('/dist/index.js')) throw new Error('Unexpected entrypoint: ' + resolved);
              // Svelte 根入口现在含 .svelte 源组件，由后续 Vite/Kit 包外构建验证。
              // 普通 Node 无 Svelte loader；core 仍须直接导入且无 DOM 依赖。
              if (name === '@zui/core') await import(name);
              console.log(name + ' -> ' + resolved);
            }
          "

      - name: Install browser engines
        run: pnpm --filter @zui/docs exec playwright install --with-deps chromium firefox webkit

      - name: Test production docs and accessibility in three browsers
        run: pnpm run test

      - name: Test development HMR in three browsers
        run: pnpm --filter @zui/svelte run test:dev

      - name: Test core DOM and hydration in three browsers
        run: pnpm run test:core:browser

      - name: Measure real browser updates and ownership budgets
        run: pnpm run benchmark:browser

      - name: Build SvelteKit production fixture
        run: pnpm --filter @zui/svelte run test:kit:build

      - name: Test SvelteKit SSR and hydration in three browsers
        run: pnpm --filter @zui/svelte run test:kit

      - name: Verify packed packages in an independent SvelteKit consumer
        run: pnpm run test:packages

      - name: Associate candidate reports and verified archives
        run: node scripts/create-evidence.mjs

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ github.sha }}
          path: |
            docs/playwright-report/
            docs/test-results/
            core/test-results/
            svelte/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-dist-${{ github.sha }}
          path: |
            core/dist/
            svelte/dist/
            docs/dist/
            svelte/test-results/packages/*.tgz
            svelte/test-results/candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
